[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cage"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4", "torchvision>=0.19", "numpy", "scipy", "pillow",
  "opencv-python-headless", "trimesh", "pycocotools", "shapely",
  "pyyaml", "tqdm", "matplotlib", "huggingface_hub", "pytest",
]

[tool.setuptools.packages.find]
include = ["cage*"]